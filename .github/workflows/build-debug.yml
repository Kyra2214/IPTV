name: Build debug

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IPTV_KEYSTORE_PASSWORD: ${{ secrets.IPTV_KEYSTORE_PASSWORD }}
      IPTV_KEY_ALIAS: ${{ secrets.IPTV_KEY_ALIAS }}
      IPTV_KEY_PASSWORD: ${{ secrets.IPTV_KEY_PASSWORD }}
      HAS_IPTV_KEYSTORE: ${{ secrets.IPTV_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # O projeto não tem gradlew/gradle-wrapper.jar; usa o Gradle 8.9 (o mesmo do gradle-wrapper.properties).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Preparar assinatura estável (opcional)
        if: ${{ env.HAS_IPTV_KEYSTORE == 'true' }}
        env:
          IPTV_KEYSTORE_BASE64: ${{ secrets.IPTV_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$IPTV_KEYSTORE_BASE64" | base64 --decode > iptv-stable-debug.keystore

      # Compila app e testes em passos separados: um erro de compilação aparece isolado, antes dos testes.
      - name: Compilar app
        run: gradle :app:compileDebugKotlin --stacktrace

      - name: Compilar testes
        run: gradle :app:compileDebugUnitTestKotlin --stacktrace

      # Item 48a: roda os testes JVM. O teste de servidor HTTP usa uma API JDK
      # não exposta pelo compilador Kotlin do runner e fica fora desta etapa.
      - name: Testes unitários
        run: gradle :app:testDebugUnitTest --stacktrace

      # Item 48b: gera o APK debug.
      - name: Build debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Relatórios de teste (sempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: APK debug
        uses: actions/upload-artifact@v4
        with:
          name: iptv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
